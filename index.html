<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybreak">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f3f1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131024" media="(prefers-color-scheme: dark)">
<!--HEAD-->
<title>Daybreak Streaks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. A sky where the sun rises as today's habits get done, then the habit rows. */
:root {
  --bg: #f3f1f8;
  --surface: #ffffff;
  --ink: #1b1630;
  --muted: #6c6686;
  --line: #e1dcee;
  --rose: #8f6bff;
  --ember: #b57cff;
  --gold: #f1b9ff;
  --on-sun: #1a0838;
  --shadow: 0 1px 2px rgba(27, 22, 48, .06), 0 8px 24px rgba(27, 22, 48, .06);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131024; --surface: #1d1936; --ink: #f4f0ff; --muted: #9c95ba; --line: #2d2850;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131024; --surface: #1d1936; --ink: #f4f0ff; --muted: #9c95ba; --line: #2d2850;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

/* Worlds: each one swaps the three glow colours. Streak milestones open them. */
[data-world="twilight"] { --rose: #8f6bff; --ember: #b57cff; --gold: #f1b9ff; --on-sun: #1a0838; }
[data-world="daybreak"] { --rose: #ff3d7f; --ember: #ff6a3d; --gold: #ffb52e; --on-sun: #2b1005; }
[data-world="aurora"]   { --rose: #a58bff; --ember: #3fd0ff; --gold: #5ef2c0; --on-sun: #06201c; }
[data-world="tidemoon"] { --rose: #7b7bff; --ember: #6fa8ff; --gold: #cfeaff; --on-sun: #0a1238; }
[data-world="nebula"]   { --rose: #7f8bff; --ember: #c77dff; --gold: #ffa3f5; --on-sun: #1c0633; }
[data-world="wildwood"] { --rose: #2fd0a5; --ember: #7be07a; --gold: #e8ff7a; --on-sun: #05230f; }
[data-world="sungold"]  { --rose: #ff9a3c; --ember: #ffc94d; --gold: #fff3b0; --on-sun: #2b1005; }
[data-world="prism"]    { --rose: #ff8fb1; --ember: #ffe27a; --gold: #7df0d0; --on-sun: #1b1630; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 16px/1.4 var(--body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }

.app {
  max-width: 460px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ---------- Sky ---------- */
.top { display: flex; align-items: flex-start; gap: 12px; }
.top-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mute {
  flex: none; width: 44px; height: 44px; padding: 0;
  display: grid; place-items: center;
  border: 1.5px solid var(--line); border-radius: 50%;
  background: none; color: var(--muted);
}
.mute svg { width: 22px; height: 22px; }
.mute .off { display: none; }
.mute[aria-pressed="false"] .on { display: none; }
.mute[aria-pressed="false"] .off { display: inline; }
.date {
  margin: 0;
  font-size: .8125rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted);
}
.count {
  margin: 0;
  font: 800 2rem/1.1 var(--display);
  letter-spacing: -.02em;
  text-wrap: balance;
}
.sky {
  --p: 0;
  position: relative;
  display: block; width: 100%;
  height: 148px;
  padding: 0;
  overflow: hidden;
  background: none;
  border: 0;
  border-bottom: 2px solid var(--line);
}
.sky:focus-visible { outline: 3px solid var(--ember); outline-offset: 3px; }
.stars {
  position: absolute; left: 0; top: 0;
  width: 2px; height: 2px; border-radius: 50%;
  color: var(--muted);
  box-shadow: 28px 34px, 82px 72px, 128px 20px, 188px 60px, 246px 28px, 302px 84px, 340px 46px, 58px 104px, 222px 98px, 404px 24px, 160px 112px, 14px 76px;
  opacity: calc(.95 - var(--p) * .7);
  animation: twinkle 2.8s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .3; } }
.world-chip {
  position: absolute; top: 8px; right: 0;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px;
  border: 1.5px solid var(--line); border-radius: 999px;
  background: var(--bg); color: var(--muted);
  font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
}
.world-chip::before {
  content: ""; width: 10px; height: 10px; border-radius: 50%;
  background: conic-gradient(var(--rose), var(--gold), var(--ember), var(--rose));
}
.sky::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(70% 120% at 50% 100%, var(--gold) 0%, var(--ember) 28%, var(--rose) 48%, transparent 72%);
  opacity: calc(.12 + var(--p) * .5);
  transition: opacity .9s ease;
}
.rays {
  position: absolute; left: 50%; bottom: -230px;
  width: 460px; height: 460px; margin-left: -230px;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, transparent 0 9deg, var(--gold) 9deg 18deg);
  -webkit-mask: radial-gradient(closest-side, #000 30%, transparent 100%);
  mask: radial-gradient(closest-side, #000 30%, transparent 100%);
  opacity: 0;
  transition: opacity .9s ease;
  animation: spin 60s linear infinite;
}
.sky.full .rays { opacity: .5; }
.sun {
  position: absolute; left: 50%; bottom: 0;
  width: 128px; height: 128px; margin-left: -64px;
  border-radius: 50%;
  background: linear-gradient(180deg, var(--gold) 0%, var(--ember) 62%, var(--rose) 100%);
  box-shadow: 0 0 40px color-mix(in srgb, var(--gold) 60%, transparent);
  transform: translateY(calc(90% - var(--p) * 74%));
  transition: transform 1s cubic-bezier(.2, .9, .25, 1.12);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Habits ---------- */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.habit {
  position: relative;
  display: flex; align-items: stretch;
  background: var(--surface);
  border-radius: 22px;
  box-shadow: var(--shadow);
  overflow: hidden;
  isolation: isolate;
  touch-action: pan-y;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  /* --f is how far the hold has charged (0 to 1); --j is the shake. */
  transform: translateX(var(--j, 0px)) scale(calc(1 + var(--f, 0) * .035));
  transition: box-shadow .35s ease, transform .35s ease;
}
.habit::before {
  content: "";
  position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(90deg, var(--rose) 0%, var(--ember) 50%, var(--gold) 100%);
  transform: scaleX(var(--f, 0));
  transform-origin: 0 50%;
  transition: transform .4s cubic-bezier(.3, .9, .3, 1);
}
.habit.holding { transition: none; box-shadow: 0 0 calc(var(--f, 0) * 48px) calc(var(--f, 0) * 7px) color-mix(in srgb, var(--ember) 85%, transparent); }
.habit.holding::before { transition: none; }
.habit.holding .ring { border-color: var(--ember); }
.habit.charged { animation: throb .32s ease-in-out infinite alternate; }
@keyframes throb { to { box-shadow: 0 0 70px 14px var(--gold); } }
.habit.lit { color: var(--on-sun); }
.habit.lit .streak { color: var(--on-sun); }
.habit.done::before { transform: scaleX(1); }
.habit.done { color: var(--on-sun); }
.habit.pop { animation: pop .7s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes pop {
  0% { transform: scale(1.035); box-shadow: 0 0 90px 26px var(--gold); }
  28% { transform: scale(1.1); }
  58% { transform: scale(.97); }
  100% { transform: scale(1); box-shadow: var(--shadow); }
}

.habit-main {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 8px;
  padding: 16px 4px 16px 18px;
  background: none; border: 0; text-align: left;
  border-radius: 22px 0 0 22px;
}
.name {
  font: 800 1.1875rem/1.2 var(--display);
  letter-spacing: -.01em;
  overflow-wrap: anywhere;
}
.meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.streak {
  display: inline-flex; align-items: center; gap: 5px;
  font-weight: 700; font-size: .9375rem;
  font-variant-numeric: tabular-nums;
  color: color-mix(in srgb, var(--ember) 68%, var(--ink));
}
.streak svg { width: 18px; height: 18px; flex: none; }
.streak.cold { color: var(--muted); }
.habit.done .streak { color: var(--on-sun); }
.week { display: inline-flex; gap: 5px; align-items: center; }
.week i {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--line);
}
.week i.on { background: var(--ember); }
.week i.today { outline: 2px solid var(--line); outline-offset: 2px; }
.week i.today.on { outline-color: currentColor; }
.habit.done .week i, .habit.lit .week i { background: color-mix(in srgb, var(--on-sun) 22%, transparent); }
.habit.done .week i.on, .habit.lit .week i.on { background: var(--on-sun); }

.check {
  flex: none;
  position: relative;
  display: grid; place-items: center;
  width: 84px;
}
.check { cursor: pointer; }
/* A real switch under the fingertip: Safari on iPhone gives a haptic tap each time a finger flips one. */
.check input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  margin: 0; opacity: 0; cursor: pointer;
}
.ring {
  width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center;
  border: 3px solid var(--line);
  color: transparent;
  transition: transform .2s ease, background-color .3s ease, border-color .3s ease, color .2s ease;
  pointer-events: none;
}
.ring svg { width: 26px; height: 26px; }

.habit.done .ring { background: var(--on-sun); border-color: var(--on-sun); color: var(--gold); }
.check:has(input:focus-visible) .ring, .mute:focus-visible, .habit-main:focus-visible, .add:focus-visible, .btn:focus-visible {
  outline: 3px solid var(--ember); outline-offset: 3px;
}

.add {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 60px; width: 100%;
  background: none;
  border: 2px dashed var(--line);
  border-radius: 22px;
  color: var(--muted);
  font-weight: 700;
}
.add svg { width: 20px; height: 20px; }
.hint { margin: 0; text-align: center; color: var(--muted); font-size: .875rem; }

/* ---------- Sheet ---------- */
dialog.sheet {
  width: calc(100% - 32px); max-width: 420px;
  margin: 10vh auto auto;
  padding: 22px;
  border: 0; border-radius: 24px;
  background: var(--surface); color: var(--ink);
  box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
}
dialog.sheet::backdrop { background: rgba(14, 10, 32, .55); }
.sheet form { display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { margin: 0; font: 800 1.375rem/1.2 var(--display); letter-spacing: -.01em; }
.sheet label.field { display: flex; flex-direction: column; gap: 6px; font-size: .8125rem; font-weight: 700; color: var(--muted); }
.sheet input[type="text"] {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--line); border-radius: 14px;
  background: var(--bg); color: var(--ink);
  font-size: 1.0625rem; font-weight: 600;
}
.sheet input[type="text"]:focus { outline: none; border-color: var(--ember); }
.stats { display: flex; gap: 10px; margin: 0; }
.stats div { flex: 1; padding: 12px; border-radius: 14px; background: var(--bg); }
.stats dt { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 2px 0 0; font: 800 1.5rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  flex: 1; min-height: 52px; padding: 0 18px;
  border: 0; border-radius: 16px;
  background: var(--bg); color: var(--ink);
  font-weight: 700;
}
.btn.primary { background: linear-gradient(100deg, var(--rose), var(--ember) 55%, var(--gold)); color: var(--on-sun); }
.btn.danger { color: var(--rose); }

/* ---------- Opening veil: one tap wakes sound and haptics ---------- */
.veil {
  position: fixed; inset: 0; z-index: 60;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 24px;
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  text-align: center; cursor: pointer;
}
.veil input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.veil-orb {
  width: 132px; height: 132px; border-radius: 50%;
  background: linear-gradient(180deg, var(--gold), var(--ember) 62%, var(--rose));
  animation: breathe 1.6s ease-in-out infinite alternate;
}
@keyframes breathe {
  from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ember) 55%, transparent), 0 0 30px var(--gold); transform: scale(.96); }
  to { box-shadow: 0 0 0 26px transparent, 0 0 70px var(--gold); transform: scale(1.04); }
}
.veil-title { margin-top: 10px; font: 800 2.25rem/1 var(--display); letter-spacing: -.03em; }
.veil-sub { font-size: .8125rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.veil.gone { animation: lift .55s ease forwards; pointer-events: none; }
@keyframes lift { to { opacity: 0; transform: scale(1.25); } }

/* ---------- Celebration ---------- */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
.flash {
  position: fixed; inset: 0; z-index: 30; pointer-events: none; opacity: 0;
  background:
    radial-gradient(90% 60% at 50% 108%, var(--gold) 0%, var(--ember) 35%, var(--rose) 60%, transparent 80%),
    radial-gradient(90% 40% at 50% -8%, var(--rose) 0%, transparent 70%);
  box-shadow: inset 0 0 90px 10px var(--ember);
}
.flash.go { animation: flash 1.3s ease-out; }
@keyframes flash { 0% { opacity: 0; } 18% { opacity: .9; } 100% { opacity: 0; } }

.toast {
  position: fixed; left: 50%; z-index: 45;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px);
  padding: 12px 18px;
  border-radius: 999px;
  background: var(--ink); color: var(--bg);
  font-weight: 700; text-align: center;
  transform: translate(-50%, 150%);
  opacity: 0;
  transition: transform .4s cubic-bezier(.3, 1.4, .5, 1), opacity .3s ease;
  pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

.milestone {
  position: fixed; inset: 0; z-index: 35;
  display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) 24px max(24px, env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, var(--rose) 0%, var(--ember) 45%, var(--gold) 100%);
  color: var(--on-sun);
  text-align: center;
  overflow: hidden;
  animation: open .75s cubic-bezier(.3, .8, .2, 1);
}
/* The celebration opens like a portal from the circle you tapped. */
@keyframes open {
  from { clip-path: circle(0 at var(--x, 50%) var(--y, 50%)); }
  to { clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); }
}
.milestone::before {
  content: "";
  position: absolute; left: 50%; top: 50%;
  width: 200vmax; height: 200vmax; margin: -100vmax 0 0 -100vmax;
  background: repeating-conic-gradient(from 0deg, transparent 0 15deg, rgba(255, 255, 255, .16) 15deg 30deg);
  -webkit-mask: radial-gradient(closest-side, transparent 6%, #000 40%, transparent 85%);
  mask: radial-gradient(closest-side, transparent 6%, #000 40%, transparent 85%);
  animation: spin 40s linear infinite;
}
.portal-ring {
  position: fixed; z-index: 38;
  width: 120px; height: 120px; margin: -60px 0 0 -60px;
  border-radius: 50%;
  pointer-events: none; opacity: 0;
  background: conic-gradient(var(--rose), var(--gold), var(--ember), var(--rose));
  -webkit-mask: radial-gradient(closest-side, transparent 64%, #000 68%, #000 90%, transparent 100%);
  mask: radial-gradient(closest-side, transparent 64%, #000 68%, #000 90%, transparent 100%);
}
.portal-ring.go { animation: portal 1.1s cubic-bezier(.2, .7, .2, 1); }
@keyframes portal {
  0% { opacity: 1; transform: scale(.3) rotate(0deg); }
  100% { opacity: 0; transform: scale(8) rotate(220deg); }
}
.ms-portal { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.ms-portal small { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.ms-portal strong { font: 800 2rem/1.05 var(--display); letter-spacing: -.02em; }

/* World picker */
.sheet .sub { margin: -8px 0 0; color: var(--muted); font-size: .9375rem; }
.worlds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.world {
  display: flex; align-items: center; gap: 14px;
  width: 100%; min-height: 60px; padding: 8px 14px 8px 10px;
  border: 2px solid transparent; border-radius: 16px;
  background: var(--bg); color: var(--ink);
  text-align: left;
}
.world:focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }
.world .orb {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(180deg, var(--gold), var(--ember) 60%, var(--rose));
}
.world .txt { display: flex; flex-direction: column; min-width: 0; }
.world .txt b { font: 800 1.0625rem/1.2 var(--display); }
.world .txt span { font-size: .8125rem; color: var(--muted); }
.world.here { border-color: var(--ember); }
.world:disabled { cursor: default; }
.world:disabled .orb { background: var(--line); }
.world:disabled .txt b { color: var(--muted); letter-spacing: .2em; }
.milestone-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 340px; }
.milestone .big { font: 800 clamp(6rem, 38vw, 10rem)/.85 var(--display); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.milestone .unit { font: 800 1.75rem/1.1 var(--display); letter-spacing: -.01em; }
.milestone p { margin: 6px 0 14px; font-size: 1.0625rem; font-weight: 600; text-wrap: balance; }
.milestone .btn { flex: none; min-width: 200px; background: var(--on-sun); color: var(--gold); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .rays { animation: none; }
}
</style>
<!--/HEAD-->
</head>
<body>
<!--BODY-->
<main class="app">
  <header class="top">
    <div class="top-text">
      <p class="date" id="date"></p>
      <h1 class="count" id="count">Daybreak</h1>
    </div>
    <button class="mute" id="mute" type="button" aria-pressed="true" aria-label="Sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/>
        <g class="on"><path d="M15.5 9a4.2 4.2 0 010 6M18.3 6.4a8 8 0 010 11.2"/></g>
        <g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
      </svg>
    </button>
  </header>

  <button class="sky" id="sky" type="button" aria-label="Choose a world">
    <span class="stars"></span>
    <span class="rays"></span>
    <span class="sun"></span>
    <span class="world-chip" id="world-chip">Twilight</span>
  </button>

  <ul class="list" id="list"></ul>

  <button class="add" id="add" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Add a habit
  </button>
  <p class="hint" id="hint">Hold a habit down until it's full, or tap its circle fast. Tap a name to rename it. Tap the sky to travel.</p>
</main>

<dialog class="sheet" id="sheet">
  <form id="sheet-form" method="dialog">
    <h2 id="sheet-title">New habit</h2>
    <dl class="stats" id="sheet-stats" hidden>
      <div><dt>Now</dt><dd id="stat-now">0</dd></div>
      <div><dt>Best</dt><dd id="stat-best">0</dd></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const KEY = 'daybreak.v1';
  const MILESTONES = [1, 3, 7, 14, 21, 30, 50, 75, 100, 150, 200, 250, 300, 365];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Dates and streaks ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const dkey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };

  function streakOf(h, t = today()) {
    let d = t;
    if (!h.days[dkey(d)]) d = shift(d, -1);
    let n = 0;
    while (h.days[dkey(d)]) { n++; d = shift(d, -1); }
    return n;
  }
  function bestOf(h) {
    const keys = Object.keys(h.days).sort();
    let best = 0, run = 0, prev = null;
    for (const k of keys) {
      const [y, m, d] = k.split('-').map(Number);
      const cur = new Date(y, m - 1, d, 12);

      if (run > best) best = run;
      prev = cur;
    }
    return best;
  }
  const isMilestone = (n) => MILESTONES.includes(n) || (n > 365 && n % 100 === 0) || (n > 365 && n % 365 === 0);
  const nextMilestone = (n) => MILESTONES.find((m) => m > n) || (Math.floor(n / 100) + 1) * 100;

  /* ---------- State ---------- */
  const uid = () => Math.random().toString(36).slice(2, 10);
  const seed = () => ({ v: 1, updatedAt: 0, habits: [{ id: uid(), name: 'Up at 5 AM for Mission Story', days: {} }] });
  const valid = (s) => s && Array.isArray(s.habits) && s.habits.every((h) => h && typeof h.name === 'string' && h.days && typeof h.days === 'object');

  let state = seed();
  try { const raw = JSON.parse(localStorage.getItem(KEY)); if (valid(raw)) state = raw; } catch (e) {}

  /* ---------- Worlds ---------- */
  const WORLDS = [
    { id: 'twilight', name: 'Twilight', at: 0 },
    { id: 'daybreak', name: 'Daybreak', at: 0 },
    { id: 'aurora', name: 'Aurora', at: 1 },
    { id: 'tidemoon', name: 'Tidemoon', at: 3 },
    { id: 'nebula', name: 'Nebula', at: 7 },
    { id: 'wildwood', name: 'Wildwood', at: 14 },
    { id: 'sungold', name: 'Sungold', at: 30 },
    { id: 'prism', name: 'Prism', at: 100 }
  ];
  // The longest streak ever reached on any habit decides which worlds are open.
  const peak = () => Math.max(state.peak || 0, ...state.habits.map(bestOf));
  function applyWorld() {

    if (!state.twilit) { state.twilit = true; state.world = 'twilight'; }
    const w = WORLDS.find((x) => x.id === state.world && x.at <= peak()) || WORLDS[0];
    if (w.id === 'twilight') delete document.documentElement.dataset.world;
    else document.documentElement.dataset.world = w.id;
    $('world-chip').textContent = w.name;
    return w;
  }

  let cloud = null, writing = false, dirty = false;
  function save() {
    state.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    pushCloud();
  }
  async function pushCloud() {
    if (!cloud) return;
    if (writing) { dirty = true; return; }
    writing = true;
    try { await cloud.set({ json: JSON.stringify(state), updatedAt: state.updatedAt }); } catch (e) {}

  }
  // When the page runs as a Claude artifact, keep a private copy on the account so the streak outlives the browser.

      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      cloud = ref;
      if (remote && typeof remote.json === 'string' && (remote.updatedAt || 0) > (state.updatedAt || 0)) {
        const parsed = JSON.parse(remote.json);
        if (valid(parsed)) {
          state = parsed;
          try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}

      const o = a.createOscillator(), vg = a.createGain();

    });

    bp.type = 'bandpass'; bp.Q.value = 2.5; bp.frequency.value = 2400; ag.gain.value = .0001;
    air.connect(bp); bp.connect(ag); ag.connect(master); ag.connect(echo); air.start();

  }
  function humSet(p) {
    if (!hum) return;
    const t = ac.currentTime, f = 392 * Math.pow(2, p * p); // rises a full octave, slowly at first
    hum.voices.forEach((v) => v.o.frequency.setTargetAtTime(f * v.mult, t, .05));
    hum.g.gain.setTargetAtTime(.035 + p * .075, t, .06);
    hum.bp.frequency.setTargetAtTime(2400 + p * 6000, t, .05);
    hum.ag.gain.setTargetAtTime(.01 + p * .05, t, .06);

    const t = ac.currentTime;

    h.ag.gain.setTargetAtTime(0, t, .07);

  }

    enter: () => play((t) => { whoosh(t, .8, 300, 4000, .18); [0, 2, 4, 7].forEach((n, i) => bell(t + .1 + i * .09, note(n + 2), .1)); }),
    tap: (i) => play((t) => { tone(t, note(i * 2), .22, .17, 'triangle'); tone(t, note(i * 2) * 2, .1, .05, 'sine'); }),
    ready: (i) => play((t) => chime(t, note(15 + (i % 3)), .04)),
    fizzle: () => play((t) => { tone(t, 420, .3, .1, 'triangle', 90); whoosh(t, .3, 2500, 300, .08); }),
    undo: () => play((t) => tone(t, 520, .18, .1, 'sine', 200)),
    click: () => play((t) => tone(t, 880, .06, .06, 'sine')),
    // The pop itself, a rush of air, a rising chord, then twinkles for as long as the stardust falls.
    pop: (big, secs) => play((t) => {
      tone(t, 560, .2, .6, 'sine', 70);
      whoosh(t, .5, 500, 6000, .28);
      (big ? [0, 2, 4, 5, 7, 9, 10, 12] : [2, 4, 5, 7, 9]).forEach((n, i) => bell(t + .06 + i * .07, note(n + 3), .13));
      let at = .5, gap = .07;
      while (at < secs) {

        at += gap * (.6 + Math.random()); gap *= 1.035;
      }
    }),
    portal: () => play((t) => { whoosh(t, 1.3, 200, 5000, .3); tone(t, 110, 1.2, .2, 'sine', 440); [0, 4, 7, 9, 12, 14].forEach((n, i) => bell(t + .5 + i * .09, note(n + 2), .11)); }),
    travel: () => play((t) => { whoosh(t, .9, 3000, 300, .22); [9, 7, 4, 2, 0].forEach((n, i) => bell(t + i * .08, note(n + 5), .1)); })
  };
  // iPhone: a few extra haptic taps, spent inside the touch events that follow a release.
  let owedTicks = 0;
  ['touchend', 'click'].forEach((ev) => addEventListener(ev, () => { if (owedTicks > 0) { owedTicks--; iosTick(); } }, true));

  /* ---------- Confetti ---------- */
  const cv = $('fx'), cx = cv.getContext('2d');
  let parts = [], raf = 0;
  function palette() {

  }

    cx.beginPath();

    for (let i = 0; i < n; i++) {
      const p = {
        x, y, vx: 0, vy: 0, g: .28, rot: rnd(0, 6.3), vr: rnd(-.3, .3),
        w: rnd(6, 12), h: rnd(4, 9), life: rnd(70, 130),
        c: COLORS[(Math.random() * COLORS.length) | 0],
        shape: Math.random() < .45 ? 'star' : Math.random() < .6 ? 'dot' : 'rect'
      };

        p.sp = { cx: x, cy: y, a: rnd(0, 6.3), r: rnd(4, 30), va: rnd(.05, .11), vr: rnd(1.6, 4.6) };

        p.vx = rnd(-1.5, 1.5); p.vy = rnd(2, 6); p.g = .08; p.life = rnd(150, 240);
      } else if (mode === 'fountain') {

  }
  const PRAISE = [
    (n) => `Day ${n}. The stars took note.`,
    (n) => `${n} in a row. Something is waking up.`,
    (n) => `Day ${n}, done before the excuses woke up.`,
    (n) => `That's ${n}. The portal hums a little louder.`,
    (n) => `${n} days. You showed up again.`,
    (n) => `Day ${n} is sealed.`,
    (n) => `${n} straight. Future you says thanks.`
  ];
  const MS_TEXT = {
    1: 'Day one. Every long streak starts exactly here.',
    3: 'Three days. It has stopped being a fluke.',
    7: 'A full week. This is turning into who you are.',
    14: 'Two weeks straight. The hard part is behind you.',
    21: 'Twenty-one days. The habit is doing some of the work now.',
    30: 'A whole month. Almost nobody gets here.',
    50: 'Fifty days of showing up.',

  /* ---------- Rendering ---------- */
  const SUN = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.8 1.8M17.4 17.4l1.8 1.8M4.8 19.2l1.8-1.8M17.4 6.6l1.8-1.8"/></g></svg>';
  const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.6 4.6L19 7.6"/></svg>';
  const rows = new Map();
  const HOLD_MS = 1500, HOLD_DELAY = 180, TAPS = 6;
  const CAN_VIBRATE = typeof navigator.vibrate === 'function';

  function buildRow(h) {
    const li = document.createElement('li');
    li.className = 'habit';
    li.innerHTML =
      '<button class="habit-main" type="button"><span class="name"></span>' +
      '<span class="meta"><span class="streak">' + SUN + '<span class="streak-text"></span></span><span class="week"></span></span></button>' +
      '<label class="check"><input type="checkbox" switch><span class="ring">' + TICK + '</span></label>';
    const input = li.querySelector('.check input');
    input.id = 'done-' + h.id;
    const isDone = () => !!h.days[dkey(today())];
    // charge: how full the row is from taps (0 to 1). press: a hold in progress. held: the last touch was a hold.
    let charge = 0, press = null, raf = 0, held = false, drain = 0, viaKey = false;
    input.addEventListener('keydown', () => { viaKey = true; });

    const showCharge = () => {
      if (charge > 0) li.style.setProperty('--f', charge.toFixed(3)); else li.style.removeProperty('--f');
      li.style.removeProperty('--j');
      li.classList.toggle('lit', charge > .62);
    };
    const clear = () => {
      cancelAnimationFrame(raf);
      li.classList.remove('holding', 'charged');
      humStop();
      showCharge();
    };
    const cancel = () => {
      if (!press) return;
      const started = press.started;
      press = null;
      if (started) { clear(); stopBuzz(); sfx.fizzle(); paintRow(h); }
    };
    const complete = () => {
      clearTimeout(drain);
      charge = 0; press = null;
      clear();
      if (!CAN_VIBRATE) { owedTicks = 2; setTimeout(() => { owedTicks = 0; }, 700); }
      toggle(h.id, true, li);
    };
    const step = (now) => {
      if (!press) return;
      const time = Math.max(0, Math.min(1, (now - press.t0 - HOLD_DELAY) / HOLD_MS));
      const p = charge + (1 - charge) * time;
      if (time > 0) {
        if (!press.started) { press.started = true; held = true; clearTimeout(drain); li.classList.add('holding'); humStart(); }
        li.style.setProperty('--f', p.toFixed(3));
        li.style.setProperty('--j', ((Math.random() - .5) * p * p * 7).toFixed(1) + 'px');
        li.classList.toggle('lit', p > .62);
        humSet(p);
        // Pulses get longer and closer together as it charges, so the buzz builds (on phones that allow it).
        if (now >= press.next) { tick(Math.round(8 + p * p * 34)); press.next = now + 135 - p * 100; }
      }
      if (time >= 1) {
        const ua = navigator.userActivation;
        if (CAN_VIBRATE && (!ua || ua.hasBeenActive)) { complete(); return; }
        // iPhone: wait for the finger to lift, the one moment Safari lets a page vibrate.
        if (!press.charged) {
          press.charged = true; press.ping = 0; press.nextPing = 0;
          li.classList.add('charged');
          li.querySelector('.streak-text').textContent = 'Let go!';
        }
        if (now >= press.nextPing) { sfx.ready(press.ping++); press.nextPing = now + 120; }
      }
      raf = requestAnimationFrame(step);
    };
    li.addEventListener('pointerdown', (e) => {
      held = false; viaKey = false;
      if (press || isDone() || (e.pointerType === 'mouse' && e.button !== 0)) return;
      press = { x: e.clientX, y: e.clientY, t0: performance.now(), next: 0 };
      raf = requestAnimationFrame(step);
    });
    li.addEventListener('pointermove', (e) => {
      if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 14) cancel();
    });
    const release = () => { if (press && press.charged) complete(); else cancel(); };
    li.addEventListener('pointerup', release);
    li.addEventListener('pointercancel', release);
    li.addEventListener('pointerleave', cancel);
    li.addEventListener('contextmenu', (e) => e.preventDefault());

    // A tap on the circle flips the switch under it. Each tap adds charge; enough of them pop it.
    input.addEventListener('change', () => {
      if (held) { held = false; input.checked = isDone(); return; }
      if (isDone()) { toggle(h.id, false, li); return; }
      if (viaKey) { complete(); return; } // keyboard: one press is enough
      clearTimeout(drain);
      charge = Math.min(1, charge + 1 / TAPS);
      const n = Math.round(charge * TAPS);
      if (n >= TAPS) { complete(); return; }
      input.checked = false;
      showCharge();
      tick(10 + n * 6);
      sfx.tap(n);
      if (n === 1) toast('Keep tapping, or hold it down.');
      drain = setTimeout(() => { charge = 0; showCharge(); sfx.fizzle(); }, 1500);
    });
    li.querySelector('.habit-main').addEventListener('click', () => {
      if (held) { held = false; return; }
      openSheet(h.id);
    });
    rows.set(h.id, li);
    return li;
  }
  function paintRow(h) {
    const li = rows.get(h.id);
    if (!li) return;
    const t = today(), done = !!h.days[dkey(t)], n = streakOf(h, t);
    li.classList.toggle('done', done);
    li.querySelector('.name').textContent = h.name;
    const input = li.querySelector('.check input');
    input.checked = done;
    input.setAttribute('aria-label', (done ? 'Done today: ' : 'Hold to mark done today: ') + h.name);
    const s = li.querySelector('.streak');
    s.classList.toggle('cold', n === 0);
    li.querySelector('.streak-text').textContent = n === 0 ? 'Start today' : n === 1 ? '1 day' : n + ' days';
    const week = li.querySelector('.week');
    week.textContent = '';
    for (let i = 6; i >= 0; i--) {
      const dot = document.createElement('i');
      if (h.days[dkey(shift(t, -i))]) dot.className = 'on';
      if (i === 0) dot.classList.add('today');
      week.appendChild(dot);
    }
    li.querySelector('.habit-main').setAttribute('aria-label', `${h.name}. ${n} day streak. Edit.`);
  }
  function paintTop() {
    const t = today();
    const total = state.habits.length;
    const done = state.habits.filter((h) => h.days[dkey(t)]).length;
    $('date').textContent = t.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    $('count').textContent = total === 0 ? 'Add your first habit'
      : done === total ? (total === 1 ? 'Done for today' : `All ${total} done today`)
      : done === 0 ? (total === 1 ? 'One thing to do today' : `${total} things to do today`)
      : `${done} of ${total} done today`;
    const sky = $('sky');
    sky.style.setProperty('--p', total ? done / total : 0);
    sky.classList.toggle('full', total > 0 && done === total);
    $('hint').hidden = total === 0;
    $('mute').setAttribute('aria-pressed', String(!state.mute));
    $('mute').setAttribute('aria-label', state.mute ? 'Sound is off' : 'Sound is on');
  }
  let shownDay = '';
  function render() {
    const list = $('list');
    list.textContent = '';
    rows.clear();
    for (const h of state.habits) { list.appendChild(buildRow(h)); paintRow(h); }
    paintTop();
    applyWorld();
    shownDay = dkey(today());
  }

  /* ---------- Checking off ---------- */
  function toggle(id, checked, li) {
    const h = state.habits.find((x) => x.id === id);
    if (!h) return;
    const k = dkey(today());
    const before = peak();
    if (checked) h.days[k] = 1; else delete h.days[k];
    const n = streakOf(h);
    state.peak = Math.max(before, n);
    const opened = checked ? WORLDS.filter((w) => w.at > before && w.at <= state.peak).pop() : null;
    save();
    paintRow(h);
    paintTop();
    if (!checked) { stopBuzz(); buzz([10]); sfx.undo(); return; }

    const allDone = state.habits.every((x) => x.days[k]);
    const r = li.querySelector('.ring').getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    li.classList.remove('pop'); void li.offsetWidth; li.classList.add('pop');
    flash();
    ring(x, y);

    if (isMilestone(n) || opened) {
      buzz(rumble(5200));
      sfx.pop(true, 5);
      spawn('spiral', x, y, 70);
      setTimeout(() => showMilestone(h, n, opened, x, y), 450);
      return;
    }
    buzz(rumble(allDone ? 3400 : 2800));
    sfx.pop(allDone && state.habits.length > 1, allDone ? 3.4 : 2.8);
    // A different payoff each time, so you never quite know what you'll get.
    const pick = (Math.random() * 4) | 0;
    if (pick === 0) spawn('spiral', x, y, 130);
    else if (pick === 1) { spawn('spiral', x, y, 45); spawn('rain', 0, 0, 120); }
    else if (pick === 2) { spawn('spiral', x, y, 45); spawn('fountain', 0, 0, 120); }
    else { spawn('burst', x, y, 50); spawn('sides', 0, 0, 120); }
    toast(allDone && state.habits.length > 1 ? `Everything done. Day ${n} on this one.` : PRAISE[(Math.random() * PRAISE.length) | 0](n));
  }

  function travel(w) {
    state.world = w.id;
    save();
    applyWorld();
    flash();
    spawn('rain', 0, 0, 140);
    buzz([20, 40, 60]);
    sfx.travel();
    toast(`Welcome to ${w.name}.`);
  }

  let msTimer = 0, pendingWorld = null;
  function showMilestone(h, n, opened, x, y) {
    const el = $('milestone');
    el.style.setProperty('--x', x + 'px');
    el.style.setProperty('--y', y + 'px');
    pendingWorld = opened || null;
    $('ms-portal').hidden = !opened;
    if (opened) $('ms-world').textContent = opened.name;
    $('ms-close').textContent = opened ? 'Step through' : 'Keep going';
    $('ms-unit').textContent = n === 1 ? 'day down' : 'day streak';
    $('ms-text').textContent = (MS_TEXT[n] || `${n} days of “${h.name}”.`) + ` Next stop: ${nextMilestone(n)}.`;
    el.hidden = false;
    sfx.portal();
    $('ms-close').focus({ preventScroll: true });
    const num = $('ms-num');
    const start = performance.now(), dur = reduced ? 0 : Math.min(1400, 300 + n * 40);
    const step = (now) => {
      const p = dur ? Math.min(1, (now - start) / dur) : 1;
      num.textContent = Math.max(1, Math.round(n * (1 - Math.pow(1 - p, 3))));
      if (p < 1) msTimer = requestAnimationFrame(step);
    };
    cancelAnimationFrame(msTimer);
    msTimer = requestAnimationFrame(step);
    spawn('rain', 0, 0, 160);
    setTimeout(() => spawn('fountain', 0, 0, 140), 350);
    setTimeout(() => spawn('sides', 0, 0, 120), 800);
  }
  $('ms-close').addEventListener('click', () => {
    $('milestone').hidden = true;
    if (pendingWorld) { travel(pendingWorld); pendingWorld = null; } else buzz([15]);
  });

  /* ---------- World picker ---------- */
  const worldsDlg = $('worlds');
  function openWorlds() {
    const list = $('world-list'), top = peak(), here = applyWorld();
    list.textContent = '';
    for (const w of WORLDS) {
      const open = w.at <= top;
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'world' + (w.id === here.id ? ' here' : '');
      b.disabled = !open;
      if (open) b.dataset.world = w.id;
      b.innerHTML = '<span class="orb"></span><span class="txt"><b></b><span></span></span>';
      b.querySelector('b').textContent = open ? w.name : '???';
      b.querySelector('.txt span').textContent = w.id === here.id ? 'You are here'
        : open ? 'Tap to travel'
        : `Opens at a ${w.at}-day streak`;
      b.addEventListener('click', () => { worldsDlg.close(); if (w.id !== here.id) travel(w); });
      li.appendChild(b);
      list.appendChild(li);
    }
    if (worldsDlg.showModal) worldsDlg.showModal(); else worldsDlg.setAttribute('open', '');
  }
  $('sky').addEventListener('click', openWorlds);
  $('worlds-close').addEventListener('click', () => worldsDlg.close());
  worldsDlg.addEventListener('click', (e) => { if (e.target === worldsDlg) worldsDlg.close(); });

  /* ---------- Add / edit sheet ---------- */
  const sheet = $('sheet');
  let editing = null, armed = false;
  function openSheet(id) {
    editing = id ? state.habits.find((h) => h.id === id) : null;
    armed = false;
    $('sheet-title').textContent = editing ? 'Edit habit' : 'New habit';
    $('sheet-save').textContent = editing ? 'Save' : 'Add';
    $('sheet-delete').hidden = !editing;
    $('sheet-delete').textContent = 'Delete';
    $('sheet-stats').hidden = !editing;
    $('habit-name').value = editing ? editing.name : '';
    if (editing) {
      $('stat-now').textContent = streakOf(editing);
      $('stat-best').textContent = bestOf(editing);
      $('stat-total').textContent = Object.keys(editing.days).length;
    }
    if (sheet.showModal) sheet.showModal(); else sheet.setAttribute('open', '');
    if (!editing) $('habit-name').focus();
  }
  function closeSheet() { if (sheet.close) sheet.close(); else sheet.removeAttribute('open'); }
  $('add').addEventListener('click', () => openSheet(null));
  $('sheet-cancel').addEventListener('click', closeSheet);
  sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
  $('sheet-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('habit-name').value.trim();
    if (!name) { $('habit-name').focus(); return; }
    if (editing) editing.name = name;
    else state.habits.push({ id: uid(), name, days: {} });
    save(); render(); closeSheet(); buzz([15]); sfx.click();
  });
  $('sheet-delete').addEventListener('click', () => {
    if (!armed) { armed = true; $('sheet-delete').textContent = 'Tap again to delete'; return; }
    state.habits = state.habits.filter((h) => h !== editing);
    save(); render(); closeSheet();
  });

  $('mute').addEventListener('click', () => {
    state.mute = !state.mute;
    if (state.mute) humStop();
    save(); paintTop();
    sfx.click();
    toast(state.mute ? 'Sound off' : 'Sound on');
  });
  // The opening tap: a real touch on a real switch, which is what wakes sound and haptics on a phone.
  $('veil-switch').addEventListener('change', () => {
    const v = $('veil');
    if (v.classList.contains('gone')) return;
    v.classList.add('gone');
    setTimeout(() => { v.hidden = true; }, 600);
    iosTick();
    try { if (navigator.vibrate) navigator.vibrate(20); } catch (e) {}
    sfx.enter();
    ring(innerWidth / 2, innerHeight / 2);
  });

  /* ---------- Boot ---------- */
  render();
  initCloud();
  // A new day starts while the app sits in the background: repaint when it comes back.
  const refresh = () => { if (dkey(today()) !== shownDay) render(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  setInterval(refresh, 60000);
  if ('serviceWorker' in navigator && !window.claude && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
<!--/BODY-->
